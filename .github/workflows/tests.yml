name: Build and run tests

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git gcc

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Run cmake
        run: |
          export VCPKG_FORCE_DOWNLOADED_BINARIES="ON"
          export PATH="$(pwd)/vcpkg:$PATH"
          export VCPKG_ROOT="$(pwd)/vcpkg"
          mkdir -p build
          cmake --preset=x64-linux-static -DCOUSB_BUILD_DOCS=OFF -DCOUSB_BUILD_EXAMPLES=OFF -DCOUSB_BUILD_TESTS=ON
          cmake --build "build/x64-linux-static" --config "Debug"

      - name: Run test
        run: |
          cd build/x64-linux-static
          mkdir -p test_reports
          ctest -V -R .

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/x64-linux-static/test_reports

